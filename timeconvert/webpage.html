<!DOCTYPE html>
<html>
<head>
    <title>Hour Minute Converter</title>
    <style>
        body{
            background-color: black;
            color:white;
            text-align: center;
        }
        h1{
            margin-top: 30px;
        }
        input{
            height: 20px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Hour-minute converter</h1>
    <input type="number" id="hours">
    <input type="number" id="minutes">
    <script>
        document.getElementById("hours").oninput = function() {
            document.getElementById("minutes").value = this.value * 60;
};
        document.getElementById("minutes").oninput = function(){
            document.getElementById("hours").value = this.value / 60;
        };
    </script>
</body>
</html>
