<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical FPS v2</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; user-select: none; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }

        /* Start Screen */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; pointer-events: auto; z-index: 10;
        }
        #start-screen h1 { font-size: 3rem; margin-bottom: 6px; color: #ff4655; letter-spacing: 4px; }
        #start-screen .subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 30px; }
        #start-screen .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 30px; font-size: 0.95rem; color: #ccc; text-align: left; }
        #start-screen .controls span { color: #00ffff; font-weight: bold; }
        #start-screen .click-hint { margin-top: 30px; font-size: 1.1rem; color: #ff4655; animation: blink 1.2s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* Crosshair */
        #crosshair-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .crosshair-line { position: absolute; background-color: #00ff00; transition: transform 0.05s ease-out; }
        #ch-top  { width: 2px; height: 8px; top: 0; left: -1px; transform: translateY(-10px); }
        #ch-bot  { width: 2px; height: 8px; top: 0; left: -1px; transform: translateY(10px); }
        #ch-left { width: 8px; height: 2px; top: -1px; left: 0; transform: translateX(-10px); }
        #ch-right{ width: 8px; height: 2px; top: -1px; left: 0; transform: translateX(10px); }

        /* Hit marker */
        #hitmarker {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 20px; height: 20px; pointer-events: none; opacity: 0; transition: opacity 0.05s;
        }
        #hitmarker.show { opacity: 1; }
        #hitmarker.headshot { filter: drop-shadow(0 0 4px #ffdd00); }
        .hm-line {
            position: absolute; background: white; border-radius: 1px;
        }
        .hm-tl { width: 6px; height: 2px; top: 4px; left: 4px; transform: rotate(45deg); }
        .hm-tr { width: 6px; height: 2px; top: 4px; right: 4px; transform: rotate(-45deg); }
        .hm-bl { width: 6px; height: 2px; bottom: 4px; left: 4px; transform: rotate(-45deg); }
        .hm-br { width: 6px; height: 2px; bottom: 4px; right: 4px; transform: rotate(45deg); }
        #hitmarker.headshot .hm-line { background: #ffdd00; }

        /* Reload bar */
        #reload-bar-wrap {
            position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
            display: none; flex-direction: column; align-items: center; gap: 4px;
        }
        #reload-bar-wrap.visible { display: flex; }
        #reload-label { color: #fff; font-size: 0.8rem; letter-spacing: 2px; }
        #reload-bar-bg { width: 160px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        #reload-bar-fill { height: 100%; width: 0%; background: #00ffff; border-radius: 2px; transition: width linear; }

        /* HUD bottom */
        #hud-bottom {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 30px; color: white; font-size: 1.4rem; font-weight: bold; align-items: flex-end;
        }
        .hud-panel { background: rgba(0,0,0,0.55); padding: 10px 18px; border-left: 4px solid #ff4655; }

        /* Weapon selector */
        #weapon-slots {
            position: absolute; bottom: 30px; right: 30px;
            display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
        }
        .weapon-slot {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.55); padding: 7px 14px;
            border-right: 3px solid #444; color: #888; font-size: 0.85rem; letter-spacing: 1px;
            transition: all 0.1s;
        }
        .weapon-slot.active { border-right-color: #00ffff; color: #fff; background: rgba(0,255,255,0.1); font-size: 0.95rem; }
        .weapon-slot .slot-key { color: #555; font-size: 0.75rem; width: 14px; }
        .weapon-slot.active .slot-key { color: #00ffff; }

        /* Abilities */
        #abilities { position: absolute; bottom: 30px; left: 30px; display: flex; gap: 12px; }
        .ability-icon {
            width: 50px; height: 50px; background: rgba(0,0,0,0.6); border: 2px solid #00ffff;
            display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 1rem;
            flex-direction: column; gap: 2px;
        }
        .ability-icon .ab-name { font-size: 0.6rem; color: #aaa; }
        .ability-icon.cooldown { border-color: #555; color: #555; opacity: 0.5; }

        /* Killfeed */
        #killfeed { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 5px; text-align: right; }
        .kill-msg { background: rgba(255,70,85,0.85); color: white; padding: 5px 14px; font-weight: bold; animation: fadeOut 2.5s forwards; font-size: 0.9rem; }
        @keyframes fadeOut { 0%{opacity:1} 80%{opacity:1} 100%{opacity:0} }

        /* Floating damage numbers */
        .dmg-num {
            position: absolute; font-weight: bold; pointer-events: none;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
            animation: floatUp 0.8s forwards ease-out;
        }
        @keyframes floatUp { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-50px);opacity:0} }

        /* Scope overlay for sniper */
        #scope-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; pointer-events: none;
        }
        #scope-overlay.visible { display: block; }
        #scope-overlay svg { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>TACTICAL v2</h1>
    <div class="subtitle">WEAPONS OVERHAUL UPDATE</div>
    <div class="controls">
        <div><span>WASD</span> Move</div>
        <div><span>SPACE</span> Jump</div>
        <div><span>LMB</span> Shoot</div>
        <div><span>RMB</span> ADS / Scope</div>
        <div><span>1-4</span> Switch Weapon</div>
        <div><span>R</span> Reload</div>
        <div><span>Q</span> Smoke Grenade</div>
        <div><span>E</span> Dash</div>
    </div>
    <div class="click-hint">CLICK TO START</div>
</div>

<div id="ui-layer">
    <div id="crosshair-container">
        <div id="ch-top" class="crosshair-line"></div>
        <div id="ch-bot" class="crosshair-line"></div>
        <div id="ch-left" class="crosshair-line"></div>
        <div id="ch-right" class="crosshair-line"></div>
    </div>

    <!-- Hit Marker -->
    <div id="hitmarker">
        <div class="hm-line hm-tl"></div>
        <div class="hm-line hm-tr"></div>
        <div class="hm-line hm-bl"></div>
        <div class="hm-line hm-br"></div>
    </div>

    <!-- Scope Overlay -->
    <div id="scope-overlay">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" fill="black"/>
            <circle cx="50" cy="50" r="30" fill="black" style="mix-blend-mode:normal"/>
            <circle cx="50" cy="50" r="30" fill="transparent" stroke="#333" stroke-width="0.3"/>
            <!-- crosshair lines -->
            <line x1="20" y1="50" x2="47" y2="50" stroke="#0f0" stroke-width="0.3"/>
            <line x1="53" y1="50" x2="80" y2="50" stroke="#0f0" stroke-width="0.3"/>
            <line x1="50" y1="20" x2="50" y2="47" stroke="#0f0" stroke-width="0.3"/>
            <line x1="50" y1="53" x2="50" y2="80" stroke="#0f0" stroke-width="0.3"/>
            <!-- range marks -->
            <line x1="44" y1="54" x2="56" y2="54" stroke="#0f0" stroke-width="0.2"/>
            <line x1="46" y1="58" x2="54" y2="58" stroke="#0f0" stroke-width="0.2"/>
            <line x1="47" y1="62" x2="53" y2="62" stroke="#0f0" stroke-width="0.2"/>
            <!-- cutout to show world -->
            <circle cx="50" cy="50" r="29.5" fill="transparent"/>
        </svg>
    </div>

    <div id="reload-bar-wrap">
        <div id="reload-label">RELOADING</div>
        <div id="reload-bar-bg"><div id="reload-bar-fill"></div></div>
    </div>

    <div id="killfeed"></div>

    <div id="abilities">
        <div id="ab-q" class="ability-icon">Q<span class="ab-name">SMOKE</span></div>
        <div id="ab-e" class="ability-icon">E<span class="ab-name">DASH</span></div>
    </div>

    <div id="hud-bottom">
        <div class="hud-panel">HP: <span id="hp-display">100</span></div>
        <div class="hud-panel"><span id="ammo-display">25</span> / <span id="reserve-display">75</span></div>
    </div>

    <div id="weapon-slots">
        <div class="weapon-slot" id="slot-4"><span class="slot-key">4</span>KNIFE</div>
        <div class="weapon-slot" id="slot-3"><span class="slot-key">3</span>OPERATOR</div>
        <div class="weapon-slot" id="slot-2"><span class="slot-key">2</span>SHORTY</div>
        <div class="weapon-slot active" id="slot-1"><span class="slot-key">1</span>VANDAL</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─────────────────────────────────────────────
//  WEAPON DEFINITIONS
// ─────────────────────────────────────────────
const WEAPONS = {
    vandal: {
        name: 'VANDAL', slot: 1,
        fireRate: 105, recoilResetTime: 320, accuracyResetTime: 150,
        maxJumpSpread: 0.20, moveSpreadMultiplier: 0.15,
        damage: { body: 40, head: 160 }, range: 100,
        ammo: 25, reserve: 75, reloadTime: 1500,
        auto: true, pellets: 1,
        adsZoom: 50,
        sprayPattern: [
            {x:0,y:0},{x:0,y:0.005},{x:0,y:0.012},{x:-0.005,y:0.018},
            {x:-0.010,y:0.022},{x:0.005,y:0.025},{x:0.015,y:0.025},{x:0.015,y:0.026}
        ],
        color: 0x222222, scale: {x:1,y:1,z:1}, geo: {w:0.15,h:0.15,d:0.6},
        muzzleColor: 0xffaa00,
    },
    shorty: {
        name: 'SHORTY', slot: 2,
        fireRate: 700, recoilResetTime: 500, accuracyResetTime: 300,
        maxJumpSpread: 0.35, moveSpreadMultiplier: 0.40,
        damage: { body: 24, head: 48 }, range: 15,
        ammo: 2, reserve: 14, reloadTime: 2200,
        auto: false, pellets: 8,
        adsZoom: 65,
        sprayPattern: [{x:0,y:0}],
        color: 0x553322, scale: {x:1,y:1,z:1}, geo: {w:0.12,h:0.12,d:0.35},
        muzzleColor: 0xff6600,
    },
    operator: {
        name: 'OPERATOR', slot: 3,
        fireRate: 1500, recoilResetTime: 800, accuracyResetTime: 500,
        maxJumpSpread: 0.5, moveSpreadMultiplier: 0.5,
        damage: { body: 150, head: 255 }, range: 200,
        ammo: 5, reserve: 20, reloadTime: 3500,
        auto: false, pellets: 1,
        adsZoom: 15, isSniper: true,
        sprayPattern: [{x:0,y:0}],
        color: 0x1a1a2e, scale: {x:1,y:1,z:1}, geo: {w:0.13,h:0.13,d:0.9},
        muzzleColor: 0xffffff,
    },
    knife: {
        name: 'KNIFE', slot: 4,
        fireRate: 500, recoilResetTime: 0, accuracyResetTime: 0,
        maxJumpSpread: 0, moveSpreadMultiplier: 0,
        damage: { body: 50, head: 150 }, range: 2.5,
        ammo: -1, reserve: -1, reloadTime: 0,
        auto: false, pellets: 1,
        adsZoom: 75,
        sprayPattern: [{x:0,y:0}],
        color: 0x777777, scale: {x:1,y:1,z:1}, geo: {w:0.04,h:0.3,d:0.4},
        muzzleColor: null,
    }
};

// ─────────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────────
const MOVEMENT_SPEED = 0.15;
const KNIFE_SPEED_MULT = 1.15;
const DASH_SPEED = 0.8;
const JUMP_FORCE = 0.2;
const GRAVITY = 0.01;
const FRICTION = 0.60;

let gunState = { lastShotTime: 0, sprayIndex: 0, timeStoppedMoving: Date.now(), currentSpread: 0 };

let gameState = {
    hp: 100,
    currentWeapon: 'vandal',
    ammo: WEAPONS.vandal.ammo,
    reserve: WEAPONS.vandal.reserve,
    isReloading: false,
    abilities: { q: { cooldown: 0, max: 300 }, e: { cooldown: 0, max: 200 } }
};

// ─────────────────────────────────────────────
//  THREE.JS SETUP
// ─────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 40, 120);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.6, 10);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// ─────────────────────────────────────────────
//  MAP
// ─────────────────────────────────────────────
const colliders = [];
function addBox(x, y, z, w, h, d, color = 0xaaaaaa) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.receiveShadow = true;
    scene.add(mesh);
    colliders.push(new THREE.Box3().setFromObject(mesh));
}

addBox(0, -0.5, 0, 100, 1, 100, 0x555555);
addBox(0, 15, 0, 100, 1, 100, 0x222222);
addBox(0, 5, -45, 100, 20, 10, 0x3344aa);
addBox(0, 5,  45, 100, 20, 10, 0x3344aa);
addBox(-45, 5, 0, 10, 20, 100, 0x336633);
addBox( 45, 5, 0, 10, 20, 100, 0xaa3333);
addBox(-10, 1, -10, 6, 2, 6, 0x888888);
addBox(15, 2, -5, 4, 4, 4, 0x888888);
addBox(0, 1.5, 20, 15, 3, 2, 0x888888);
addBox(-20, 1, 15, 2, 2, 10, 0x888888);
addBox(20, 2.5, -20, 8, 5, 3, 0x888888);
addBox(5, 1, -25, 3, 2, 3, 0x888888);

// ─────────────────────────────────────────────
//  PLAYER
// ─────────────────────────────────────────────
const player = { velocity: new THREE.Vector3(), onGround: false, isADS: false };
const keys = { w: false, a: false, s: false, d: false, space: false };
let pitch = 0, yaw = 0;

document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (keys.hasOwnProperty(k) || k === ' ') keys[k === ' ' ? 'space' : k] = true;
    if (k === 'q') useAbility('q');
    if (k === 'e') useAbility('e');
    if (k === 'r') reload();
    if (k === '1') switchWeapon('vandal');
    if (k === '2') switchWeapon('shorty');
    if (k === '3') switchWeapon('operator');
    if (k === '4') switchWeapon('knife');
});
document.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (keys.hasOwnProperty(k) || k === ' ') keys[k === ' ' ? 'space' : k] = false;
});

document.addEventListener('mousedown', (e) => {
    if (document.pointerLockElement === document.body) {
        if (e.button === 2) startADS();
    } else {
        document.body.requestPointerLock();
        document.getElementById('start-screen').style.display = 'none';
    }
});
document.addEventListener('mouseup', (e) => { if (e.button === 2) stopADS(); });

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body) {
        const sens = 0.002;
        yaw   -= e.movementX * sens;
        pitch -= e.movementY * sens;
        pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
        camera.rotation.set(pitch, yaw, 0);
    }
});

function startADS() {
    player.isADS = true;
    const wep = WEAPONS[gameState.currentWeapon];
    if (wep.isSniper) document.getElementById('scope-overlay').classList.add('visible');
}
function stopADS() {
    player.isADS = false;
    document.getElementById('scope-overlay').classList.remove('visible');
}

// ─────────────────────────────────────────────
//  WEAPON 3D MODEL
// ─────────────────────────────────────────────
const gunGroup = new THREE.Group();
camera.add(gunGroup);

// Main body
const gunBodyGeo = new THREE.BoxGeometry(0.15, 0.15, 0.6);
const gunBodyMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
const gun = new THREE.Mesh(gunBodyGeo, gunBodyMat);
gunGroup.add(gun);

// Barrel (small box sticking forward)
const barrelGeo = new THREE.BoxGeometry(0.05, 0.05, 0.25);
const barrelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const barrel = new THREE.Mesh(barrelGeo, barrelMat);
barrel.position.set(0, 0.04, -0.42);
gunGroup.add(barrel);

// Muzzle flash (hidden by default)
const muzzleGeo = new THREE.SphereGeometry(0.08, 8, 8);
const muzzleMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
const muzzleFlash = new THREE.Mesh(muzzleGeo, muzzleMat);
muzzleFlash.position.set(0, 0.04, -0.6);
muzzleFlash.scale.set(1, 1, 2);
gunGroup.add(muzzleFlash);

// Point light for muzzle flash
const muzzleLight = new THREE.PointLight(0xffaa00, 0, 5);
muzzleLight.position.set(0, 0.04, -0.6);
gunGroup.add(muzzleLight);

gunGroup.position.set(0.2, -0.2, -0.4);

function applyGunVisuals(weaponId) {
    const wep = WEAPONS[weaponId];
    gun.geometry.dispose();
    gun.geometry = new THREE.BoxGeometry(wep.geo.w, wep.geo.h, wep.geo.d);
    gun.material.color.setHex(wep.color);
    if (wep.muzzleColor) muzzleMat.color.setHex(wep.muzzleColor);

    // Reset transforms
    gun.position.set(0, 0, 0);
    gun.rotation.set(0, 0, 0);
    barrel.visible = (weaponId !== 'knife');

    if (weaponId === 'knife') {
        gun.rotation.z = 0.3;
        gun.rotation.x = 0.4;
        gun.position.set(0.05, -0.05, 0.1);
        barrel.visible = false;
        muzzleFlash.visible = false;
    } else {
        muzzleFlash.visible = true;
        muzzleFlash.position.z = -(wep.geo.d / 2) - 0.08;
        muzzleLight.position.z = -(wep.geo.d / 2) - 0.08;
    }
}

// ─────────────────────────────────────────────
//  WEAPON SWITCHING
// ─────────────────────────────────────────────
function switchWeapon(id) {
    if (id === gameState.currentWeapon) return;
    stopADS();
    gameState.isReloading = false;
    cancelReloadBar();
    gameState.currentWeapon = id;
    const wep = WEAPONS[id];
    // Each weapon remembers its own ammo — use stored values if we had them
    gameState.ammo = wep.ammo;
    gameState.reserve = wep.reserve;
    gunState.sprayIndex = 0;
    gunState.lastShotTime = 0;
    applyGunVisuals(id);
    updateHUD();
    updateWeaponSlots();

    // Small draw animation
    gunGroup.rotation.x = 0.4;
    setTimeout(() => { gunGroup.rotation.x = 0; }, 150);
}

function updateWeaponSlots() {
    for (const [id, wep] of Object.entries(WEAPONS)) {
        const el = document.getElementById(`slot-${wep.slot}`);
        if (el) el.classList.toggle('active', id === gameState.currentWeapon);
    }
}

// ─────────────────────────────────────────────
//  ENEMIES
// ─────────────────────────────────────────────
const enemies = [];

function spawnBot() {
    const botGroup = new THREE.Group();
    const hitbox = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, 1.4, 8),
        new THREE.MeshBasicMaterial({ visible: false })
    );
    hitbox.position.y = 0.7;
    hitbox.userData = { isBody: true };
    botGroup.add(hitbox);

    const stickMat = new THREE.MeshStandardMaterial({ color: 0xff4655 });
    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffaaaa })
    );
    head.position.y = 1.6;
    head.userData = { isHead: true };
    botGroup.add(head);

    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.7), stickMat.clone());
    torso.position.y = 1.1; botGroup.add(torso);
    const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.6), stickMat.clone());
    lArm.position.set(-0.15,1.25,0); lArm.rotation.z=0.1; botGroup.add(lArm);
    const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.6), stickMat.clone());
    rArm.position.set(0.15,1.25,0); rArm.rotation.z=-0.1; botGroup.add(rArm);
    const lLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.7), stickMat.clone());
    lLeg.position.set(-0.15,0.4,0); lLeg.rotation.z=-0.1; botGroup.add(lLeg);
    const rLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.7), stickMat.clone());
    rLeg.position.set(0.15,0.4,0); rLeg.rotation.z=0.1; botGroup.add(rLeg);

    let x, z;
    do {
        x = (Math.random() - 0.5) * 70;
        z = (Math.random() - 0.5) * 70;
    } while (Math.abs(x - camera.position.x) < 8 && Math.abs(z - camera.position.z) < 8);

    botGroup.position.set(x, 0, z);
    botGroup.rotation.y = Math.random() * Math.PI * 2;
    scene.add(botGroup);
    enemies.push({ group: botGroup, hp: 150 });
}

for (let i = 0; i < 6; i++) spawnBot();

// ─────────────────────────────────────────────
//  COMBAT
// ─────────────────────────────────────────────
let isShooting = false;
document.addEventListener('mousedown', (e) => { if (e.button === 0 && document.pointerLockElement) isShooting = true; });
document.addEventListener('mouseup',   (e) => { if (e.button === 0) isShooting = false; });

let hitmarkerTimeout = null;
function showHitMarker(isHead) {
    const hm = document.getElementById('hitmarker');
    hm.classList.remove('show','headshot');
    void hm.offsetWidth; // reflow
    hm.classList.add('show');
    if (isHead) hm.classList.add('headshot');
    clearTimeout(hitmarkerTimeout);
    hitmarkerTimeout = setTimeout(() => hm.classList.remove('show','headshot'), isHead ? 300 : 150);
}

function showMuzzleFlash() {
    const wep = WEAPONS[gameState.currentWeapon];
    if (!wep.muzzleColor) return;
    muzzleMat.opacity = 0.9;
    muzzleLight.intensity = 3;
    muzzleFlash.scale.set(
        0.8 + Math.random()*0.4,
        0.8 + Math.random()*0.4,
        1.5 + Math.random()*0.5
    );
    setTimeout(() => { muzzleMat.opacity = 0; muzzleLight.intensity = 0; }, 40);
}

function spawnDamageNumber(dmg, isHead, worldPos) {
    // project world pos to screen
    const v = worldPos.clone().project(camera);
    const x = ( v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
    if (v.z > 1) return; // behind camera

    const el = document.createElement('div');
    el.className = 'dmg-num';
    el.innerText = dmg;
    el.style.left = (x + (Math.random()-0.5)*30) + 'px';
    el.style.top  = (y - 20) + 'px';
    el.style.color = isHead ? '#ffdd00' : '#ffffff';
    el.style.fontSize = isHead ? '1.4rem' : '1rem';
    document.getElementById('ui-layer').appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function processShooting() {
    if (!isShooting || gameState.isReloading) return;
    const wep = WEAPONS[gameState.currentWeapon];
    const now = Date.now();

    if (gameState.currentWeapon === 'knife') {
        if (now - gunState.lastShotTime < wep.fireRate) return;
        gunState.lastShotTime = now;
        gunGroup.position.z -= 0.3; gunGroup.rotation.x -= 0.5;
        setTimeout(() => { gunGroup.position.z += 0.3; gunGroup.rotation.x += 0.5; }, 100);
        executeHitscan(wep.range, {x:0,y:0}, 0, 1);
        if (!wep.auto) isShooting = false;
        return;
    }

    if (gameState.ammo <= 0) { if (gameState.reserve > 0) reload(); return; }
    if (now - gunState.lastShotTime < wep.fireRate) return;

    gameState.ammo--;
    updateHUD();

    if (now - gunState.lastShotTime > wep.recoilResetTime) gunState.sprayIndex = 0;

    let inaccuracy = 0;
    if (!player.onGround) inaccuracy = wep.maxJumpSpread;
    else if (gunState.timeStoppedMoving === 0 || (now - gunState.timeStoppedMoving < wep.accuracyResetTime)) {
        const speed = Math.sqrt(player.velocity.x**2 + player.velocity.z**2);
        inaccuracy = Math.max(0.01, speed * wep.moveSpreadMultiplier);
    }

    const maxIdx = wep.sprayPattern.length - 1;
    const spray = wep.sprayPattern[Math.min(gunState.sprayIndex, maxIdx)];
    pitch -= spray.y * 0.5;
    yaw   -= spray.x * 0.5;
    camera.rotation.set(pitch, yaw, 0);

    gunGroup.position.z += 0.06;
    gunState.lastShotTime = now;
    gunState.sprayIndex++;
    gunState.currentSpread = inaccuracy + Math.abs(spray.y);

    showMuzzleFlash();
    executeHitscan(wep.range, spray, inaccuracy, wep.pellets);

    if (!wep.auto) isShooting = false;
}

function executeHitscan(range, spray, inaccuracy, pellets) {
    const wep = WEAPONS[gameState.currentWeapon];
    let hitEnemy = false, isHead = false;
    let hitDmg = 0;
    let hitWorldPos = null;

    for (let p = 0; p < pellets; p++) {
        const raycaster = new THREE.Raycaster();
        raycaster.near = 0.5;
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

        const spreadScale = (pellets > 1) ? 0.07 : 1;
        const rx = (Math.random() - 0.5) * inaccuracy + (pellets>1 ? (Math.random()-0.5)*spreadScale : 0);
        const ry = (Math.random() - 0.5) * inaccuracy + (pellets>1 ? (Math.random()-0.5)*spreadScale : 0);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const up    = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
        fwd.add(right.multiplyScalar(spray.x + rx));
        fwd.add(up.multiplyScalar(spray.y + ry));
        fwd.normalize();

        raycaster.set(camera.position, fwd);
        const intersects = raycaster.intersectObjects(scene.children, true);
        let hitPoint = raycaster.ray.at(range, new THREE.Vector3());

        for (let i = 0; i < intersects.length; i++) {
            const hit = intersects[i];
            if (hit.distance < 0.5 || hit.distance > range) continue;
            hitPoint = hit.point;
            const hitObj = hit.object;

            if (hitObj.userData.isHead || hitObj.userData.isBody) {
                const enemyGroup = hitObj.parent;
                const idx = enemies.findIndex(e => e.group === enemyGroup);
                if (idx !== -1) {
                    const headshot = hitObj.userData.isHead;
                    const dmg = headshot ? wep.damage.head : wep.damage.body;
                    enemies[idx].hp -= dmg;
                    hitEnemy = true;
                    isHead = headshot;
                    hitDmg += dmg;
                    hitWorldPos = hit.point.clone();
                    hitWorldPos.y += 0.5;

                    enemyGroup.traverse(c => {
                        if (c.material && c.material.emissive) {
                            c.material.emissive.setHex(headshot ? 0xffff00 : 0xffffff);
                            setTimeout(() => { if (c.material) c.material.emissive.setHex(0x000000); }, 60);
                        }
                    });

                    if (enemies[idx].hp <= 0) {
                        scene.remove(enemyGroup);
                        enemies.splice(idx, 1);
                        logKill();
                        setTimeout(spawnBot, 1200);
                    }
                }
                break;
            } else if (hitObj !== gun && hitObj !== barrel && hitObj !== muzzleFlash && !hitObj.userData.isBody) {
                // bullet hole for rifles/sniper
                if (gameState.currentWeapon !== 'knife') {
                    const hole = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.08, 0.08),
                        new THREE.MeshBasicMaterial({ color: 0x111111 })
                    );
                    hole.position.copy(hit.point).add(hit.face.normal.clone().multiplyScalar(0.01));
                    hole.lookAt(hit.point.clone().add(hit.face.normal));
                    scene.add(hole);
                    setTimeout(() => scene.remove(hole), 5000);
                }
                break;
            }
        }

        // Tracer line (not for knife/shotgun)
        if (gameState.currentWeapon === 'vandal' || gameState.currentWeapon === 'operator') {
            const tracerColor = gameState.currentWeapon === 'operator' ? 0xaaffff : 0xffffaa;
            const mat = new THREE.LineBasicMaterial({ color: tracerColor, transparent: true, opacity: 0.7 });
            const start = gunGroup.localToWorld(new THREE.Vector3(0, 0, -(WEAPONS[gameState.currentWeapon].geo.d/2 + 0.05)));
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, hitPoint]), mat);
            scene.add(line);
            setTimeout(() => scene.remove(line), 50);
        }
    }

    if (hitEnemy) {
        showHitMarker(isHead);
        if (hitWorldPos) spawnDamageNumber(hitDmg, isHead, hitWorldPos);
    }
}

// ─────────────────────────────────────────────
//  RELOAD
// ─────────────────────────────────────────────
let reloadBarInterval = null;

function cancelReloadBar() {
    clearInterval(reloadBarInterval);
    const wrap = document.getElementById('reload-bar-wrap');
    wrap.classList.remove('visible');
    document.getElementById('reload-bar-fill').style.transition = 'none';
    document.getElementById('reload-bar-fill').style.width = '0%';
}

function reload() {
    const wep = WEAPONS[gameState.currentWeapon];
    if (gameState.currentWeapon === 'knife' || gameState.isReloading) return;
    if (gameState.ammo === wep.ammo || gameState.reserve <= 0) return;
    gameState.isReloading = true;

    // Reload animation
    gunGroup.rotation.x = -0.5;

    // Progress bar
    const wrap = document.getElementById('reload-bar-wrap');
    const fill = document.getElementById('reload-bar-fill');
    wrap.classList.add('visible');
    fill.style.transition = 'none';
    fill.style.width = '0%';
    setTimeout(() => {
        fill.style.transition = `width ${wep.reloadTime}ms linear`;
        fill.style.width = '100%';
    }, 20);

    setTimeout(() => {
        const needed = wep.ammo - gameState.ammo;
        const given = Math.min(needed, gameState.reserve);
        gameState.ammo += given;
        gameState.reserve -= given;
        gameState.isReloading = false;
        gunGroup.rotation.x = 0;
        cancelReloadBar();
        updateHUD();
    }, wep.reloadTime);
}

// ─────────────────────────────────────────────
//  ABILITIES
// ─────────────────────────────────────────────
function useAbility(type) {
    const ab = gameState.abilities[type];
    if (ab.cooldown > 0) return;
    ab.cooldown = ab.max;
    updateHUD();

    if (type === 'q') {
        const smoke = new THREE.Mesh(
            new THREE.SphereGeometry(3.5, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x330066, transparent: true, opacity: 0.95 })
        );
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        smoke.position.copy(camera.position).add(dir.multiplyScalar(15));
        smoke.position.y = 1;
        scene.add(smoke);
        setTimeout(() => scene.remove(smoke), 7000);
    } else if (type === 'e') {
        const dashQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));
        const dashDir = new THREE.Vector3(0, 0, -1).applyQuaternion(dashQuat);
        player.velocity.add(dashDir.multiplyScalar(DASH_SPEED));
    }
}

// ─────────────────────────────────────────────
//  CROSSHAIR / HUD
// ─────────────────────────────────────────────
function updateCrosshairUI() {
    const wep = WEAPONS[gameState.currentWeapon];
    const now = Date.now();

    // Hide crosshair for scoped sniper
    const scoped = player.isADS && wep.isSniper;
    document.getElementById('crosshair-container').style.opacity = scoped ? '0' : '1';
    if (scoped) return;

    let spread = 0;
    if (!player.onGround) spread = wep.maxJumpSpread;
    else if (gunState.timeStoppedMoving === 0 || (now - gunState.timeStoppedMoving < wep.accuracyResetTime))
        spread = 0.05;
    if (now - gunState.lastShotTime < wep.recoilResetTime)
        spread += gunState.currentSpread;

    // Bigger default gap for shotgun
    const base = gameState.currentWeapon === 'shorty' ? 8 : 4;
    const gap = base + (spread * 600);
    document.getElementById('ch-top').style.transform   = `translate(-1px, -${gap+8}px)`;
    document.getElementById('ch-bot').style.transform   = `translate(-1px, ${gap}px)`;
    document.getElementById('ch-left').style.transform  = `translate(-${gap+8}px, -1px)`;
    document.getElementById('ch-right').style.transform = `translate(${gap}px, -1px)`;
}

function logKill() {
    const kf = document.getElementById('killfeed');
    const msg = document.createElement('div');
    msg.className = 'kill-msg';
    msg.innerText = '🎯 BOT ELIMINATED';
    kf.appendChild(msg);
    setTimeout(() => msg.remove(), 2500);
}

function updateHUD() {
    const wep = WEAPONS[gameState.currentWeapon];
    const ammoEl   = document.getElementById('ammo-display');
    const reserveEl = document.getElementById('reserve-display');
    if (gameState.currentWeapon === 'knife') {
        ammoEl.innerText = '∞';
        reserveEl.innerText = '∞';
    } else {
        ammoEl.innerText = gameState.ammo;
        reserveEl.innerText = gameState.reserve;
    }
    // Pulse red when low
    ammoEl.style.color = (gameState.ammo <= Math.ceil(wep.ammo * 0.25) && gameState.currentWeapon !== 'knife') ? '#ff4655' : '#fff';

    document.getElementById('hp-display').innerText = gameState.hp;

    const q = document.getElementById('ab-q');
    const e = document.getElementById('ab-e');
    gameState.abilities.q.cooldown > 0 ? q.classList.add('cooldown') : q.classList.remove('cooldown');
    gameState.abilities.e.cooldown > 0 ? e.classList.add('cooldown') : e.classList.remove('cooldown');
}

// ─────────────────────────────────────────────
//  MAIN LOOP
// ─────────────────────────────────────────────
function animate() {
    requestAnimationFrame(animate);

    const moveDir = new THREE.Vector3();
    if (keys.w) moveDir.z -= 1;
    if (keys.s) moveDir.z += 1;
    if (keys.a) moveDir.x -= 1;
    if (keys.d) moveDir.x += 1;
    moveDir.normalize().applyEuler(new THREE.Euler(0, yaw, 0));

    const currentSpeed = Math.sqrt(player.velocity.x**2 + player.velocity.z**2);
    if (currentSpeed > 0.01) gunState.timeStoppedMoving = 0;
    else if (gunState.timeStoppedMoving === 0) gunState.timeStoppedMoving = Date.now();

    const wep = WEAPONS[gameState.currentWeapon];
    const speedMult = MOVEMENT_SPEED * (gameState.currentWeapon === 'knife' ? KNIFE_SPEED_MULT : 1.0)
                    * (player.isADS ? 0.7 : 1.0); // slow when ADS

    if (player.onGround) {
        player.velocity.x += moveDir.x * speedMult;
        player.velocity.z += moveDir.z * speedMult;
        if (keys.space) { player.velocity.y = JUMP_FORCE; player.onGround = false; }
    } else {
        player.velocity.x += moveDir.x * (speedMult * 0.1);
        player.velocity.z += moveDir.z * (speedMult * 0.1);
    }

    player.velocity.y -= GRAVITY;
    player.velocity.x *= FRICTION;
    player.velocity.z *= FRICTION;

    function checkWallCollision() {
        const box = new THREE.Box3().setFromCenterAndSize(
            new THREE.Vector3(camera.position.x, camera.position.y - 0.7, camera.position.z),
            new THREE.Vector3(0.6, 1.4, 0.6)
        );
        for (const c of colliders) { if (c.intersectsBox(box)) return true; }
        return false;
    }

    camera.position.y += player.velocity.y;
    if (camera.position.y < 1.6) {
        camera.position.y = 1.6;
        player.velocity.y = 0;
        player.onGround = true;
    }
    camera.position.x += player.velocity.x;
    if (checkWallCollision()) { camera.position.x -= player.velocity.x; player.velocity.x = 0; }
    camera.position.z += player.velocity.z;
    if (checkWallCollision()) { camera.position.z -= player.velocity.z; player.velocity.z = 0; }

    // Gun sway / bob
    const bob = player.onGround ? Math.sin(Date.now() * 0.008) * currentSpeed * 0.015 : 0;
    gunGroup.position.y = THREE.MathUtils.lerp(gunGroup.position.y, -0.2 + bob, 0.15);
    gunGroup.position.z = THREE.MathUtils.lerp(gunGroup.position.z, -0.4, 0.1);

    const adsX = player.isADS && gameState.currentWeapon !== 'knife' ? 0 : 0.2;
    gunGroup.position.x = THREE.MathUtils.lerp(gunGroup.position.x, adsX, 0.2);

    // Scope hides gun model
    gunGroup.visible = !(player.isADS && wep.isSniper);

    const targetFOV = player.isADS ? wep.adsZoom : 75;
    camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.15);
    camera.updateProjectionMatrix();

    if (gameState.abilities.q.cooldown > 0) { gameState.abilities.q.cooldown--; if (!gameState.abilities.q.cooldown) updateHUD(); }
    if (gameState.abilities.e.cooldown > 0) { gameState.abilities.e.cooldown--; if (!gameState.abilities.e.cooldown) updateHUD(); }

    processShooting();
    updateCrosshairUI();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Init
applyGunVisuals('vandal');
updateHUD();
animate();
</script>
