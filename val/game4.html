<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical FPS v4</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;font-family:'Courier New',monospace;user-select:none}
canvas{display:block}
#scope-canvas{display:block;border-radius:50%}
#ui-layer{position:absolute;top:0;left:0;width:100vw;height:100vh;pointer-events:none}

/* ── START / ROUND END SCREENS ── */
.overlay-screen{
  position:absolute;inset:0;background:rgba(0,0,0,0.88);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:#fff;pointer-events:auto;z-index:20;
}
.overlay-screen h1{font-size:3rem;margin:0 0 4px;color:#ff4655;letter-spacing:4px}
.overlay-screen .subtitle{color:#666;font-size:0.85rem;margin-bottom:28px;letter-spacing:2px}
.start-btn{margin-top:10px;padding:12px 36px;font-family:inherit;font-size:1rem;letter-spacing:3px;cursor:pointer;border:none;background:#ff4655;color:#fff}
.start-btn:hover{background:#ff6470}
.settings-btn{margin-top:10px;padding:10px 28px;font-family:inherit;font-size:0.85rem;letter-spacing:2px;cursor:pointer;border:1px solid #444;background:transparent;color:#aaa}
.settings-btn:hover{border-color:#00ffff;color:#00ffff}
.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 40px;font-size:0.9rem;color:#999;margin-bottom:4px}
.controls-grid .key{color:#00ffff;font-weight:bold;display:inline-block;min-width:70px}
#round-result{display:none}
#round-result h1{font-size:2.5rem}
#round-result.win h1{color:#00ff99}
#round-result.lose h1{color:#ff4655}
#round-result p{color:#aaa;margin:6px 0 20px;font-size:1rem}

/* ── KEYBIND MENU ── */
#keybind-menu{position:absolute;inset:0;background:rgba(0,0,0,0.92);display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;z-index:30;pointer-events:auto}
#keybind-menu.open{display:flex}
#keybind-menu h2{font-size:1.6rem;letter-spacing:4px;color:#00ffff;margin:0 0 6px}
#keybind-menu .kb-subtitle{color:#555;font-size:0.75rem;letter-spacing:2px;margin-bottom:28px}
.kb-table{width:520px;border-collapse:collapse}
.kb-section-header td{padding:10px 0 4px;color:#ff4655;font-size:0.7rem;letter-spacing:3px;border-bottom:1px solid #222}
.kb-row{border-bottom:1px solid #1a1a1a}
.kb-row td{padding:9px 12px;font-size:0.9rem}
.kb-row .kb-action{color:#aaa;width:200px}
.kb-row .kb-bind{text-align:right}
.kb-btn{display:inline-block;min-width:90px;padding:5px 14px;background:#111;border:1px solid #333;color:#fff;font-family:inherit;font-size:0.85rem;letter-spacing:1px;cursor:pointer;text-align:center;text-transform:uppercase}
.kb-btn:hover{border-color:#555;background:#1a1a1a}
.kb-btn.listening{border-color:#00ffff;color:#00ffff;background:rgba(0,255,255,0.07);animation:pulse-border 0.8s infinite}
.kb-btn.conflict{border-color:#ff4655;color:#ff4655}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(0,255,255,0.4)}50%{box-shadow:0 0 0 4px rgba(0,255,255,0)}}
.kb-footer{display:flex;gap:12px;margin-top:22px}
.kb-save-btn{padding:10px 32px;font-family:inherit;font-size:0.85rem;letter-spacing:2px;cursor:pointer;border:none;background:#ff4655;color:#fff}
.kb-save-btn:hover{background:#ff6470}
.kb-reset-btn{padding:10px 24px;font-family:inherit;font-size:0.85rem;letter-spacing:2px;cursor:pointer;border:1px solid #444;background:transparent;color:#aaa}
.kb-reset-btn:hover{border-color:#aaa;color:#fff}
.kb-cancel-btn{padding:10px 24px;font-family:inherit;font-size:0.85rem;letter-spacing:2px;cursor:pointer;border:1px solid #333;background:transparent;color:#666}
.kb-cancel-btn:hover{border-color:#555;color:#aaa}
#kb-conflict-msg{margin-top:10px;font-size:0.75rem;color:#ff4655;letter-spacing:1px;height:16px;text-align:center}

/* ── CROSSHAIR ── */
#crosshair-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.crosshair-line{position:absolute;background:#00ff00;transition:transform 0.05s ease-out}
#ch-top {width:2px;height:8px;top:0;left:-1px;transform:translateY(-10px)}
#ch-bot {width:2px;height:8px;top:0;left:-1px;transform:translateY(10px)}
#ch-left{width:8px;height:2px;top:-1px;left:0;transform:translateX(-10px)}
#ch-right{width:8px;height:2px;top:-1px;left:0;transform:translateX(10px)}

/* ── HIT MARKER ── */
#hitmarker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;opacity:0}
#hitmarker.show{opacity:1}
.hm-line{position:absolute;background:#fff;border-radius:1px}
.hm-tl{width:6px;height:2px;top:4px;left:4px;transform:rotate(45deg)}
.hm-tr{width:6px;height:2px;top:4px;right:4px;transform:rotate(-45deg)}
.hm-bl{width:6px;height:2px;bottom:4px;left:4px;transform:rotate(-45deg)}
.hm-br{width:6px;height:2px;bottom:4px;right:4px;transform:rotate(45deg)}
#hitmarker.headshot .hm-line{background:#ffdd00}
#hitmarker.headshot{filter:drop-shadow(0 0 4px #ffdd00)}

/* ── SCOPE OVERLAY ── */
#scope-overlay{position:absolute;inset:0;display:none;pointer-events:none;background:black;overflow:hidden}
#scope-overlay.visible{display:block}
#scope-canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;width:520px;height:520px;clip-path:circle(50%)}
#scope-reticle{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}

/* ── RELOAD BAR ── */
#reload-bar-wrap{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:4px}
#reload-bar-wrap.visible{display:flex}
#reload-label{color:#fff;font-size:0.8rem;letter-spacing:2px}
#reload-bar-bg{width:160px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px}
#reload-bar-fill{height:100%;width:0%;background:#00ffff;border-radius:2px;transition:width linear}

/* ── SPIKE PROGRESS ── */
#spike-bar-wrap{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:4px}
#spike-bar-wrap.visible{display:flex}
#spike-bar-label{font-size:0.85rem;letter-spacing:3px;font-weight:bold}
#spike-bar-bg{width:200px;height:6px;background:rgba(255,255,255,0.15);border-radius:3px}
#spike-bar-fill{height:100%;width:0%;border-radius:3px;transition:width linear}

/* ── SPIKE TIMER ── */
#spike-timer{
  position:absolute;top:20px;left:50%;transform:translateX(-50%);
  display:none;flex-direction:column;align-items:center;gap:4px;
}
#spike-timer.visible{display:flex}
#spike-timer-label{font-size:0.7rem;letter-spacing:3px;color:#aaa}
#spike-timer-val{font-size:2rem;font-weight:bold;letter-spacing:2px;color:#ff4655;animation:pulse-red 1s infinite}
@keyframes pulse-red{0%,100%{text-shadow:0 0 8px #ff4655}50%{text-shadow:0 0 20px #ff4655}}

/* ── ROLE BADGE ── */
#role-badge{position:absolute;top:20px;left:20px;padding:5px 12px;font-size:0.75rem;letter-spacing:2px;font-weight:bold}
#role-badge.attacker{background:rgba(255,70,85,0.8);color:#fff}
#role-badge.defender{background:rgba(0,100,200,0.8);color:#fff}

/* ── SPIKE CARRY ── */
#spike-carry{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:0.8rem;letter-spacing:2px;color:#ffdd00;display:none}
#spike-carry.visible{display:block}

/* ── INTERACT PROMPT ── */
#interact-prompt{position:absolute;top:55%;left:50%;transform:translateX(-50%);font-size:0.9rem;letter-spacing:2px;color:#fff;display:none;text-align:center;background:rgba(0,0,0,0.6);padding:6px 16px}
#interact-prompt.visible{display:block}

/* ── HUD ── */
#hud-bottom{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:30px;color:#fff;font-size:1.4rem;font-weight:bold;align-items:flex-end}
.hud-panel{background:rgba(0,0,0,0.55);padding:10px 18px;border-left:4px solid #ff4655}
#weapon-slots{position:absolute;bottom:30px;right:30px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.weapon-slot{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.55);padding:7px 14px;border-right:3px solid #333;color:#666;font-size:0.85rem;letter-spacing:1px;transition:all 0.1s}
.weapon-slot.active{border-right-color:#00ffff;color:#fff;background:rgba(0,255,255,0.08)}
.weapon-slot .slot-key{color:#444;font-size:0.75rem;width:18px}
.weapon-slot.active .slot-key{color:#00ffff}
#abilities{position:absolute;bottom:30px;left:30px;display:flex;gap:12px}
.ability-icon{width:50px;height:50px;background:rgba(0,0,0,0.6);border:2px solid #00ffff;display:flex;justify-content:center;align-items:center;color:#fff;font-weight:bold;flex-direction:column;gap:2px}
.ability-icon .ab-name{font-size:0.6rem;color:#aaa}
.ability-icon.cooldown{border-color:#333;color:#444;opacity:0.5}
#killfeed{position:absolute;top:20px;right:20px;display:flex;flex-direction:column;gap:5px;text-align:right}
.kill-msg{background:rgba(255,70,85,0.85);color:#fff;padding:5px 14px;font-weight:bold;animation:fadeOut 2.5s forwards;font-size:0.9rem}
@keyframes fadeOut{0%{opacity:1}80%{opacity:1}100%{opacity:0}}
.dmg-num{position:absolute;font-weight:bold;pointer-events:none;text-shadow:0 0 4px rgba(0,0,0,0.8);animation:floatUp 0.8s forwards ease-out}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}
#esc-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#333;font-size:0.65rem;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start-screen" class="overlay-screen">
  <h1>TACTICAL v4</h1>
  <div class="subtitle">SPIKE PROTOCOL</div>
  <div class="controls-grid" id="start-controls-grid"></div>
  <button class="start-btn" id="start-btn">▶ PLAY AS ATTACKER</button>
  <button class="start-btn" id="start-btn-def" style="background:#1155aa;margin-top:6px">▶ PLAY AS DEFENDER</button>
  <button class="settings-btn" id="open-kb-btn">⚙ KEYBIND SETTINGS</button>
</div>

<!-- ROUND RESULT -->
<div id="round-result" class="overlay-screen">
  <h1 id="result-title">VICTORY</h1>
  <p id="result-sub">Spike detonated</p>
  <button class="start-btn" id="result-restart">PLAY AGAIN</button>
</div>

<!-- KEYBIND MENU -->
<div id="keybind-menu">
  <h2>KEYBINDS</h2>
  <div class="kb-subtitle">CLICK A BINDING THEN PRESS ANY KEY</div>
  <table class="kb-table"><tbody id="kb-tbody"></tbody></table>
  <div id="kb-conflict-msg"></div>
  <div class="kb-footer">
    <button class="kb-save-btn" id="kb-save">SAVE &amp; CLOSE</button>
    <button class="kb-reset-btn" id="kb-reset">RESET DEFAULTS</button>
    <button class="kb-cancel-btn" id="kb-cancel">CANCEL</button>
  </div>
</div>

<!-- GAME UI -->
<div id="ui-layer">
  <div id="crosshair-container">
    <div id="ch-top" class="crosshair-line"></div><div id="ch-bot" class="crosshair-line"></div>
    <div id="ch-left" class="crosshair-line"></div><div id="ch-right" class="crosshair-line"></div>
  </div>
  <div id="hitmarker">
    <div class="hm-line hm-tl"></div><div class="hm-line hm-tr"></div>
    <div class="hm-line hm-bl"></div><div class="hm-line hm-br"></div>
  </div>

  <!-- Sniper scope: black background + a small canvas showing scoped view + SVG reticle -->
  <div id="scope-overlay">
    <canvas id="scope-canvas" width="520" height="520"></canvas>
    <svg id="scope-reticle" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- black corners -->
      <rect x="0"  y="0"  width="35" height="100" fill="black"/>
      <rect x="65" y="0"  width="35" height="100" fill="black"/>
      <rect x="35" y="0"  width="30" height="35"  fill="black"/>
      <rect x="35" y="65" width="30" height="35"  fill="black"/>
      <!-- lens circle border -->
      <circle cx="50" cy="50" r="14.7" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
      <!-- reticle lines -->
      <line x1="35" y1="50" x2="47.5" y2="50" stroke="#0f0" stroke-width="0.4"/>
      <line x1="52.5" y1="50" x2="65" y2="50" stroke="#0f0" stroke-width="0.4"/>
      <line x1="50" y1="35" x2="50" y2="47.5" stroke="#0f0" stroke-width="0.4"/>
      <line x1="50" y1="52.5" x2="50" y2="65" stroke="#0f0" stroke-width="0.4"/>
      <!-- range marks -->
      <line x1="46" y1="53" x2="54" y2="53" stroke="#0f0" stroke-width="0.25"/>
      <line x1="47" y1="56" x2="53" y2="56" stroke="#0f0" stroke-width="0.25"/>
      <line x1="48" y1="59" x2="52" y2="59" stroke="#0f0" stroke-width="0.25"/>
    </svg>
  </div>

  <div id="reload-bar-wrap"><div id="reload-label">RELOADING</div><div id="reload-bar-bg"><div id="reload-bar-fill"></div></div></div>
  <div id="spike-bar-wrap"><div id="spike-bar-label">PLANTING</div><div id="spike-bar-bg"><div id="spike-bar-fill" style="background:#ffdd00"></div></div></div>
  <div id="spike-timer"><div id="spike-timer-label">SPIKE</div><div id="spike-timer-val">45</div></div>
  <div id="interact-prompt"></div>
  <div id="spike-carry">◈ SPIKE EQUIPPED — F to plant on site</div>
  <div id="role-badge" class="attacker">ATTACKER</div>
  <div id="killfeed"></div>
  <div id="abilities">
    <div id="ab-smoke" class="ability-icon">?<span class="ab-name">SMOKE</span></div>
    <div id="ab-dash"  class="ability-icon">?<span class="ab-name">DASH</span></div>
  </div>
  <div id="hud-bottom">
    <div class="hud-panel">HP: <span id="hp-display">100</span></div>
    <div class="hud-panel"><span id="ammo-display">25</span> / <span id="reserve-display">75</span></div>
  </div>
  <div id="weapon-slots">
    <div class="weapon-slot" id="slot-4"><span class="slot-key" id="slotkey-4">4</span>KNIFE</div>
    <div class="weapon-slot" id="slot-3"><span class="slot-key" id="slotkey-3">3</span>OPERATOR</div>
    <div class="weapon-slot" id="slot-2"><span class="slot-key" id="slotkey-2">2</span>SHORTY</div>
    <div class="weapon-slot active" id="slot-1"><span class="slot-key" id="slotkey-1">1</span>VANDAL</div>
  </div>
  <div id="esc-hint">ESC — SETTINGS</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ═══ KEYBIND SYSTEM ═══════════════════════════════════════════
const DEFAULT_BINDS={moveForward:'w',moveBack:'s',moveLeft:'a',moveRight:'d',jump:' ',reload:'r',smoke:'q',dash:'e',weapon1:'1',weapon2:'2',weapon3:'3',weapon4:'4',shoot:'mouse0',ads:'mouse1',interact:'f'};
const BIND_META=[
  {section:'MOVEMENT'},{id:'moveForward',label:'Move Forward'},{id:'moveBack',label:'Move Backward'},
  {id:'moveLeft',label:'Strafe Left'},{id:'moveRight',label:'Strafe Right'},{id:'jump',label:'Jump'},
  {section:'COMBAT'},{id:'shoot',label:'Shoot',mouse:true},{id:'ads',label:'ADS / Scope',mouse:true},{id:'reload',label:'Reload'},
  {section:'WEAPONS'},{id:'weapon1',label:'Vandal (slot 1)'},{id:'weapon2',label:'Shorty (slot 2)'},{id:'weapon3',label:'Operator (slot 3)'},{id:'weapon4',label:'Knife (slot 4)'},
  {section:'ABILITIES'},{id:'smoke',label:'Smoke Grenade'},{id:'dash',label:'Dash'},
  {section:'SPIKE'},{id:'interact',label:'Pick up / Plant / Defuse'},
];
let binds=Object.assign({},DEFAULT_BINDS);
try{const s=localStorage.getItem('tacticalBindsV4');if(s)binds=Object.assign({},DEFAULT_BINDS,JSON.parse(s));}catch(e){}
let pendingBinds=null;

function formatKey(k){
  if(k===' ')return'SPACE';if(k==='mouse0')return'LMB';if(k==='mouse1')return'RMB';if(k==='mouse2')return'MMB';
  if(k==='escape')return'ESC';if(k==='shift')return'SHIFT';if(k==='control')return'CTRL';if(k==='alt')return'ALT';
  if(k==='arrowup')return'↑';if(k==='arrowdown')return'↓';if(k==='arrowleft')return'←';if(k==='arrowright')return'→';
  return k.toUpperCase();
}
function findConflict(b,excludeId,val){for(const[k,v]of Object.entries(b))if(k!==excludeId&&v===val)return k;return null;}

function buildKbTable(b){
  const tbody=document.getElementById('kb-tbody');tbody.innerHTML='';
  BIND_META.forEach(item=>{
    if(item.section){const tr=document.createElement('tr');tr.className='kb-section-header';tr.innerHTML=`<td colspan="2">${item.section}</td>`;tbody.appendChild(tr);return;}
    const tr=document.createElement('tr');tr.className='kb-row';
    const c=findConflict(b,item.id,b[item.id]);
    tr.innerHTML=`<td class="kb-action">${item.label}</td><td class="kb-bind"><button class="kb-btn${c?' conflict':''}" data-id="${item.id}">${formatKey(b[item.id])}</button></td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.kb-btn').forEach(btn=>btn.addEventListener('click',()=>startListening(btn)));
}

let listeningBtn=null,listeningId=null,kbKeyH=null,kbMouseH=null;
function startListening(btn){
  if(listeningBtn)listeningBtn.classList.remove('listening');
  stopListening(false);
  listeningBtn=btn;listeningId=btn.dataset.id;btn.classList.add('listening');btn.textContent='...';
  document.getElementById('kb-conflict-msg').textContent='';
  kbKeyH=(e)=>{e.preventDefault();if(e.key==='Escape'){stopListening(true);return;}assignBind(listeningId,e.key.toLowerCase());stopListening(false);};
  kbMouseH=(e)=>{e.preventDefault();assignBind(listeningId,`mouse${e.button}`);stopListening(false);};
  setTimeout(()=>{window.addEventListener('keydown',kbKeyH,{capture:true});document.getElementById('kb-tbody').addEventListener('mousedown',kbMouseH,{capture:true});},120);
}
function stopListening(cancelled){
  if(kbKeyH)window.removeEventListener('keydown',kbKeyH,{capture:true});
  if(kbMouseH)document.getElementById('kb-tbody').removeEventListener('mousedown',kbMouseH,{capture:true});
  kbKeyH=null;kbMouseH=null;
  if(listeningBtn){listeningBtn.classList.remove('listening');if(cancelled)listeningBtn.textContent=formatKey(pendingBinds[listeningId]);listeningBtn=null;listeningId=null;}
}
function assignBind(id,key){
  const conflict=findConflict(pendingBinds,id,key);
  if(conflict){const old=pendingBinds[id];pendingBinds[conflict]=old;}
  pendingBinds[id]=key;buildKbTable(pendingBinds);
  if(conflict){const lbl=BIND_META.find(m=>m.id===conflict)?.label||conflict;document.getElementById('kb-conflict-msg').textContent=`⚠ ${lbl} → ${formatKey(pendingBinds[conflict])}`;}
}
function openKbMenu(){pendingBinds=Object.assign({},binds);buildKbTable(pendingBinds);document.getElementById('kb-conflict-msg').textContent='';document.getElementById('keybind-menu').classList.add('open');stopListening(false);}
function closeKbMenu(save){
  stopListening(false);
  if(save){binds=Object.assign({},pendingBinds);try{localStorage.setItem('tacticalBindsV4',JSON.stringify(binds));}catch(e){}updateAbilityHud();updateWeaponSlotKeys();}
  document.getElementById('keybind-menu').classList.remove('open');pendingBinds=null;
}
document.getElementById('open-kb-btn').addEventListener('click',openKbMenu);
document.getElementById('kb-save').addEventListener('click',()=>closeKbMenu(true));
document.getElementById('kb-cancel').addEventListener('click',()=>closeKbMenu(false));
document.getElementById('kb-reset').addEventListener('click',()=>{pendingBinds=Object.assign({},DEFAULT_BINDS);buildKbTable(pendingBinds);document.getElementById('kb-conflict-msg').textContent='✓ Reset to defaults';});

function buildStartControls(){
  const grid=document.getElementById('start-controls-grid');
  const SHOW=[['moveForward/moveBack/moveLeft/moveRight','Move'],['jump','Jump'],['shoot','Shoot'],['ads','ADS/Scope'],['weapon1','Vandal'],['weapon2','Shorty'],['weapon3','Operator'],['weapon4','Knife'],['reload','Reload'],['smoke','Smoke'],['dash','Dash'],['interact','Plant/Defuse/Pickup']];
  grid.innerHTML=SHOW.map(([id,label])=>{
    const keyStr=id.includes('/')?id.split('/').map(i=>formatKey(binds[i])).slice(0,4).join('/'):formatKey(binds[id]);
    return`<div><span class="key">${keyStr}</span> ${label}</div>`;
  }).join('');
}

// ═══ WEAPONS ══════════════════════════════════════════════════
const WEAPONS={
  vandal:{name:'VANDAL',slot:1,fireRate:105,recoilResetTime:320,accuracyResetTime:150,maxJumpSpread:0.20,moveSpreadMultiplier:0.15,damage:{body:40,head:160},range:100,ammo:25,reserve:75,reloadTime:1500,auto:true,pellets:1,adsZoom:50,sprayPattern:[{x:0,y:0},{x:0,y:0.005},{x:0,y:0.012},{x:-.005,y:.018},{x:-.01,y:.022},{x:.005,y:.025},{x:.015,y:.025},{x:.015,y:.026}],color:0x222222,geo:{w:.15,h:.15,d:.6},muzzleColor:0xffaa00},
  shorty:{name:'SHORTY',slot:2,fireRate:700,recoilResetTime:500,accuracyResetTime:300,maxJumpSpread:0.35,moveSpreadMultiplier:0.40,damage:{body:24,head:48},range:15,ammo:2,reserve:14,reloadTime:2200,auto:false,pellets:8,adsZoom:65,sprayPattern:[{x:0,y:0}],color:0x553322,geo:{w:.12,h:.12,d:.35},muzzleColor:0xff6600},

// ═══ INTERACT / SPIKE LOGIC ════════════════════════════════════
function startInteract(){
  if(roundOver)return;
  if(!interactHeld){   // only reset timer on fresh press
    interactHeld=true;
    interactStart=Date.now();
  }
}
function stopInteract(){
  interactHeld=false;
  interactStart=0;
  hideSpikeBar();
  showInteractPrompt('');
}

function checkInteract(){
  if(!interactHeld||roundOver)return;
  const now=Date.now();
  const playerPos=camera.position;

  // ── PICKUP spike (defender or attacker near dropped spike) ──
  if(!spikeState.carried&&!spikeState.planted&&spikeState.mesh){
    const d=playerPos.distanceTo(spikeState.mesh.position);
    if(d<3){
      if(playerRole==='attacker'){
        // Instant pickup
        spikeState.carried=true;
        scene.remove(spikeState.mesh);
        showInteractPrompt('');
        document.getElementById('spike-carry').classList.add('visible');
        hideSpikeBar();
        return;
      }
    }
  }

  // ── PLANT spike (attacker, carrying, on site) ──
  if(spikeState.carried&&playerRole==='attacker'&&!spikeState.planted){
    // Check only XZ footprint — just compare X and Z ranges directly
    const px=playerPos.x, pz=playerPos.z;
    const onSite=(px>=spikeState.siteBox.min.x&&px<=spikeState.siteBox.max.x&&pz>=spikeState.siteBox.min.z&&pz<=spikeState.siteBox.max.z);
    if(onSite){
      const elapsed=now-interactStart;
      const prog=Math.min(elapsed/PLANT_TIME,1);
      showSpikeBar('PLANTING','#ffdd00',prog);
      if(prog>=1){
        plantSpike();
        stopInteract();
      }
      return;
    } else {
      showInteractPrompt('Move onto the site to plant');
      return;
    }
  }

  // ── DEFUSE spike (defender, spike planted) ──
  if(spikeState.planted&&!spikeState.defused&&playerRole==='defender'){
    const d=playerPos.distanceTo(spikeState.mesh.position);
    if(d<3){
      const elapsed=now-interactStart;
      const prog=Math.min(elapsed/DEFUSE_TIME,1);
      showSpikeBar('DEFUSING','#00ffff',prog);
      if(prog>=1){
        defuseSpike();
        stopInteract();
      }
      return;
    } else {
      showInteractPrompt('Get closer to defuse');
      return;
    }
  }
}

function plantSpike(){
  spikeState.carried=false;spikeState.planted=true;
  document.getElementById('spike-carry').classList.remove('visible');
  // Drop spike at current player feet
  spikeState.mesh.position.set(camera.position.x,0.25,camera.position.z);
  scene.add(spikeState.mesh);
  // Start timer
  spikeState.timerActive=true;
  spikeState.timeLeft=SPIKE_TIMER;
  spikeState.lastTick=Date.now();
  document.getElementById('spike-timer').classList.add('visible');
  document.getElementById('spike-timer-val').textContent=SPIKE_TIMER;
  logMsg('💥 SPIKE PLANTED!','#ffdd00');
}

function defuseSpike(){
  spikeState.defused=true;spikeState.timerActive=false;
  document.getElementById('spike-timer').classList.remove('visible');
  scene.remove(spikeState.mesh);
  logMsg('✅ SPIKE DEFUSED!','#00ffff');
  setTimeout(()=>endRound(playerRole==='defender'),500);
}

function tickSpikeTimer(){
  if(!spikeState.timerActive||spikeState.defused||spikeState.exploded)return;
  const now=Date.now();
  const delta=(now-spikeState.lastTick)/1000;
  spikeState.lastTick=now;
  spikeState.timeLeft-=delta;
  if(spikeState.timeLeft<=0){
    spikeState.timeLeft=0;spikeState.timerActive=false;spikeState.exploded=true;
    document.getElementById('spike-timer').classList.remove('visible');
    // Explosion flash
    renderer.domElement.style.transition='background 0.05s';
    renderer.domElement.style.backgroundColor='#ff4400';
    setTimeout(()=>renderer.domElement.style.backgroundColor='',300);
    logMsg('💥 SPIKE DETONATED!','#ff4655');
    // Attacker wins if spike detonates
    setTimeout(()=>endRound(playerRole==='attacker'),800);
  } else {
    document.getElementById('spike-timer-val').textContent=Math.ceil(spikeState.timeLeft);
    // Flash light on spike
    if(spikeState.mesh){
      const l=spikeState.mesh.userData.indicatorLight;
      if(l){const t=spikeState.timeLeft%1;l.material.color.setHex(t>0.5?0xff0000:0xff8800);}
    }
  }
}

function endRound(playerWon){
  roundOver=true;isShooting=false;
  document.exitPointerLock();
  const res=document.getElementById('round-result');
  res.style.display='flex';
  res.className='overlay-screen '+(playerWon?'win':'lose');
  document.getElementById('result-title').textContent=playerWon?'VICTORY':'DEFEAT';
  const reasons={
    attacker:{true:'Spike detonated!',false:'Spike defused by defenders.'},
    defender:{true:'Spike defused!',false:'Spike detonated — site lost.'}
  };
  document.getElementById('result-sub').textContent=reasons[playerRole][playerWon];
}

}
function spawnDamageNumber(dmg,isHead,worldPos){
  const v=worldPos.clone().project(camera);if(v.z>1)return;
  const el=document.createElement('div');el.className='dmg-num';el.innerText=dmg;
  el.style.left=((v.x*.5+.5)*innerWidth+(Math.random()-.5)*30)+'px';
  el.style.top=((-v.y*.5+.5)*innerHeight-20)+'px';
  el.style.color=isHead?'#ffdd00':'#fff';el.style.fontSize=isHead?'1.4rem':'1rem';
  document.getElementById('ui-layer').appendChild(el);setTimeout(()=>el.remove(),800);
}

function processShooting(){
  if(!isShooting||gameState.isReloading||roundOver)return;
  const wep=WEAPONS[gameState.currentWeapon];const now=Date.now();
  if(gameState.currentWeapon==='knife'){
    if(now-gunState.lastShotTime<wep.fireRate)return;
    gunState.lastShotTime=now;gunGroup.position.z-=0.3;gunGroup.rotation.x-=0.5;
    setTimeout(()=>{gunGroup.position.z+=0.3;gunGroup.rotation.x+=0.5;},100);
    executeHitscan(wep.range,{x:0,y:0},0,1);if(!wep.auto)isShooting=false;return;
  }
  // AUTO-RELOAD when empty
  if(gameState.ammo<=0){if(gameState.reserve>0)reload();isShooting=false;return;}
  if(now-gunState.lastShotTime<wep.fireRate)return;
  gameState.ammo--;updateHUD();
  if(now-gunState.lastShotTime>wep.recoilResetTime)gunState.sprayIndex=0;
  let inaccuracy=0;
  if(!player.onGround)inaccuracy=wep.maxJumpSpread;
  else if(gunState.timeStoppedMoving===0||(now-gunState.timeStoppedMoving<wep.accuracyResetTime)){
    const spd=Math.sqrt(player.velocity.x**2+player.velocity.z**2);
    inaccuracy=Math.max(0.01,spd*wep.moveSpreadMultiplier);
  }
  const spray=wep.sprayPattern[Math.min(gunState.sprayIndex,wep.sprayPattern.length-1)];
  pitch-=spray.y*.5;yaw-=spray.x*.5;camera.rotation.set(pitch,yaw,0);
  gunGroup.position.z+=0.06;gunState.lastShotTime=now;gunState.sprayIndex++;
  gunState.currentSpread=inaccuracy+Math.abs(spray.y);
  showMuzzleFlash();executeHitscan(wep.range,spray,inaccuracy,wep.pellets);
  if(!wep.auto)isShooting=false;
}

function executeHitscan(range,spray,inaccuracy,pellets){
  const wep=WEAPONS[gameState.currentWeapon];
  let hitEnemy=false,isHead=false,hitDmg=0,hitWorldPos=null;
  for(let p=0;p<pellets;p++){
    const rc=new THREE.Raycaster();rc.near=0.5;
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    const ss=pellets>1?0.07:1;
    const rx=(Math.random()-.5)*inaccuracy+(pellets>1?(Math.random()-.5)*ss:0);
    const ry=(Math.random()-.5)*inaccuracy+(pellets>1?(Math.random()-.5)*ss:0);
    fwd.add(new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion).multiplyScalar(spray.x+rx));
    fwd.add(new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion).multiplyScalar(spray.y+ry));
    fwd.normalize();rc.set(camera.position,fwd);
    const its=rc.intersectObjects(scene.children,true);
    let hitPoint=rc.ray.at(range,new THREE.Vector3());
    for(let i=0;i<its.length;i++){
      const hit=its[i];if(hit.distance<0.5||hit.distance>range)continue;
      hitPoint=hit.point;const obj=hit.object;
      if(obj.userData.isHead||obj.userData.isBody){
        const eg=obj.parent;const idx=enemies.findIndex(e=>e.group===eg);
        if(idx!==-1){
          const hs=obj.userData.isHead;const dmg=hs?wep.damage.head:wep.damage.body;
          enemies[idx].hp-=dmg;hitEnemy=true;isHead=hs;hitDmg+=dmg;
          hitWorldPos=hit.point.clone();hitWorldPos.y+=0.5;
          eg.traverse(c=>{if(c.material&&c.material.emissive){c.material.emissive.setHex(hs?0xffff00:0xffffff);setTimeout(()=>{if(c.material)c.material.emissive.setHex(0);},60);}});
          if(enemies[idx].hp<=0){
            scene.remove(eg);enemies.splice(idx,1);
            logMsg(`🎯 ${enemies[idx]?.isDefender?'DEFENDER':'ATTACKER'} ELIMINATED`,'#ff4655');
            setTimeout(()=>spawnBot(enemies.length<3?true:false),2000);
          }
        }break;
      } else if(obj!==gun&&obj!==barrel&&obj!==muzzleFlash&&!obj.userData.isBody&&!obj.userData.isSpike){
        if(gameState.currentWeapon!=='knife'){
          const hole=new THREE.Mesh(new THREE.PlaneGeometry(.08,.08),new THREE.MeshBasicMaterial({color:0x111111}));
          hole.position.copy(hit.point).add(hit.face.normal.clone().multiplyScalar(.01));
          hole.lookAt(hit.point.clone().add(hit.face.normal));
          scene.add(hole);setTimeout(()=>scene.remove(hole),5000);
        }break;
      }
    }
    if(gameState.currentWeapon==='vandal'||gameState.currentWeapon==='operator'){
      const tc=gameState.currentWeapon==='operator'?0xaaffff:0xffffaa;
      const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([gunGroup.localToWorld(new THREE.Vector3(0,0,-(WEAPONS[gameState.currentWeapon].geo.d/2+.05))),hitPoint]),new THREE.LineBasicMaterial({color:tc,transparent:true,opacity:.7}));
      scene.add(line);setTimeout(()=>scene.remove(line),50);
    }
  }
  if(hitEnemy){showHitMarker(isHead);if(hitWorldPos)spawnDamageNumber(hitDmg,isHead,hitWorldPos);}
}

// ═══ RELOAD ══════════════════════════════════════════════════
function cancelReloadBar(){
  document.getElementById('reload-bar-wrap').classList.remove('visible');
  document.getElementById('reload-bar-fill').style.transition='none';
  document.getElementById('reload-bar-fill').style.width='0%';
}
function reload(){
  const wep=WEAPONS[gameState.currentWeapon];
  if(gameState.currentWeapon==='knife'||gameState.isReloading)return;
  if(gameState.ammo===wep.ammo||gameState.reserve<=0)return;
  gameState.isReloading=true;gunGroup.rotation.x=-0.5;
  const fill=document.getElementById('reload-bar-fill');
  document.getElementById('reload-bar-wrap').classList.add('visible');
  fill.style.transition='none';fill.style.width='0%';
  setTimeout(()=>{fill.style.transition=`width ${wep.reloadTime}ms linear`;fill.style.width='100%';},20);
  setTimeout(()=>{
    const needed=wep.ammo-gameState.ammo;const given=Math.min(needed,gameState.reserve);
    gameState.ammo+=given;gameState.reserve-=given;
    gameState.isReloading=false;gunGroup.rotation.x=0;
    cancelReloadBar();updateHUD();
  },wep.reloadTime);
}

// ═══ ABILITIES ════════════════════════════════════════════════
function useAbility(type){
  const ab=gameState.abilities[type];if(ab.cooldown>0)return;
  ab.cooldown=ab.max;updateHUD();
  if(type==='smoke'){
    const smoke=new THREE.Mesh(new THREE.SphereGeometry(3.5,32,32),new THREE.MeshStandardMaterial({color:0x330066,transparent:true,opacity:.95}));
    smoke.position.copy(camera.position).add(new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(15));
    smoke.position.y=1;scene.add(smoke);setTimeout(()=>scene.remove(smoke),7000);
  } else if(type==='dash'){
    const dq=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,yaw,0,'YXZ'));
    player.velocity.add(new THREE.Vector3(0,0,-1).applyQuaternion(dq).multiplyScalar(DASH_SPEED));
  }
}

// ═══ HUD HELPERS ═════════════════════════════════════════════
function showSpikeBar(label,color,progress){
  document.getElementById('spike-bar-wrap').classList.add('visible');
  document.getElementById('spike-bar-label').textContent=label;
  document.getElementById('spike-bar-label').style.color=color;
  document.getElementById('spike-bar-fill').style.background=color;
  document.getElementById('spike-bar-fill').style.width=(progress*100)+'%';
}
function hideSpikeBar(){document.getElementById('spike-bar-wrap').classList.remove('visible');document.getElementById('spike-bar-fill').style.width='0%';}
function showInteractPrompt(msg){
  const el=document.getElementById('interact-prompt');
  if(msg){el.textContent=msg;el.classList.add('visible');}
  else el.classList.remove('visible');
}
function logMsg(text,color){
  const kf=document.getElementById('killfeed');const msg=document.createElement('div');
  msg.className='kill-msg';msg.style.background=color||'rgba(255,70,85,0.85)';msg.innerText=text;
  kf.appendChild(msg);setTimeout(()=>msg.remove(),3000);
}
function updateCrosshairUI(){
  const wep=WEAPONS[gameState.currentWeapon];const now=Date.now();
  let spread=0;
  if(!player.onGround)spread=wep.maxJumpSpread;
  else if(gunState.timeStoppedMoving===0||(now-gunState.timeStoppedMoving<wep.accuracyResetTime))spread=0.05;
  if(now-gunState.lastShotTime<wep.recoilResetTime)spread+=gunState.currentSpread;
  const base=gameState.currentWeapon==='shorty'?8:4;const gap=base+(spread*600);
  document.getElementById('ch-top').style.transform=`translate(-1px,-${gap+8}px)`;
  document.getElementById('ch-bot').style.transform=`translate(-1px,${gap}px)`;
  document.getElementById('ch-left').style.transform=`translate(-${gap+8}px,-1px)`;
  document.getElementById('ch-right').style.transform=`translate(${gap}px,-1px)`;
}
function updateHUD(){
  const wep=WEAPONS[gameState.currentWeapon];
  const ae=document.getElementById('ammo-display'),re=document.getElementById('reserve-display');
  if(gameState.currentWeapon==='knife'){ae.innerText='∞';re.innerText='∞';}
  else{ae.innerText=gameState.ammo;re.innerText=gameState.reserve;}
  ae.style.color=(gameState.ammo<=Math.ceil(wep.ammo*.25)&&gameState.currentWeapon!=='knife')?'#ff4655':'#fff';
  document.getElementById('hp-display').innerText=gameState.hp;
  const sq=document.getElementById('ab-smoke'),se=document.getElementById('ab-dash');
  gameState.abilities.smoke.cooldown>0?sq.classList.add('cooldown'):sq.classList.remove('cooldown');
  gameState.abilities.dash.cooldown>0?se.classList.add('cooldown'):se.classList.remove('cooldown');
}

// ═══ GAME START ═══════════════════════════════════════════════
function startGame(role){
  playerRole=role;
  document.getElementById('start-screen').style.display='none';
  document.getElementById('role-badge').className='role-badge '+role;
  document.getElementById('role-badge').textContent=role.toUpperCase();
  // Set spawn
  camera.position.copy(role==='attacker'?ATK_SPAWN:DEF_SPAWN);
  yaw=role==='attacker'?Math.PI:0; pitch=0;
  camera.rotation.set(pitch,yaw,0);
  placeSpike();
  if(role==='attacker'){document.getElementById('spike-carry').classList.add('visible');}
  document.body.requestPointerLock();
  roundOver=false;
}

document.getElementById('start-btn').addEventListener('click',()=>startGame('attacker'));
document.getElementById('start-btn-def').addEventListener('click',()=>startGame('defender'));
document.getElementById('result-restart').addEventListener('click',()=>{
  document.getElementById('round-result').style.display='none';
  document.getElementById('start-screen').style.display='flex';
  // Reset state
  roundOver=false;spikeState={carried:false,planted:false,defused:false,exploded:false,plantProgress:0,defuseProgress:0,timeLeft:SPIKE_TIMER,timerActive:false,lastTick:0,mesh:null,siteBox:spikeState.siteBox};
  document.getElementById('spike-timer').classList.remove('visible');
  document.getElementById('spike-carry').classList.remove('visible');
  if(spikeState.mesh)scene.remove(spikeState.mesh);
  gameState={hp:100,currentWeapon:'vandal',ammo:WEAPONS.vandal.ammo,reserve:WEAPONS.vandal.reserve,isReloading:false,abilities:{smoke:{cooldown:0,max:300},dash:{cooldown:0,max:200}}};
  applyGunVisuals('vandal');updateHUD();buildStartControls();
});

// ═══ INTERACT PROMPT LOGIC (passive check each frame) ════════
function updateInteractPrompt(){
  if(roundOver){showInteractPrompt('');return;}
  const pos=camera.position;
  // Near dropped spike
  if(!spikeState.carried&&!spikeState.planted&&spikeState.mesh){
    const d=pos.distanceTo(spikeState.mesh.position);
    if(d<3&&playerRole==='attacker'){showInteractPrompt(`[${formatKey(binds.interact)}] Pick up Spike`);return;}
  }
  // On site with spike (attacker)
  if(spikeState.carried&&playerRole==='attacker'){
    const pp=new THREE.Vector3(pos.x,1,pos.z);
    if(spikeState.siteBox.containsPoint(pp)){showInteractPrompt(`[${formatKey(binds.interact)}] Hold to Plant`);return;}
    else{showInteractPrompt('Carry spike to the site (orange floor)');return;}
  }
  // Defuse prompt (defender near planted spike)
  if(spikeState.planted&&!spikeState.defused&&playerRole==='defender'){
    const d=pos.distanceTo(spikeState.mesh.position);
    if(d<3){showInteractPrompt(`[${formatKey(binds.interact)}] Hold to Defuse`);return;}
  }
  showInteractPrompt('');
}

// ═══ MAIN LOOP ════════════════════════════════════════════════
function animate(){
  requestAnimationFrame(animate);
  if(roundOver){renderer.render(scene,camera);return;}

  const moveDir=new THREE.Vector3();
  if(moveState.moveForward)moveDir.z-=1;if(moveState.moveBack)moveDir.z+=1;
  if(moveState.moveLeft)moveDir.x-=1;if(moveState.moveRight)moveDir.x+=1;
  moveDir.normalize().applyEuler(new THREE.Euler(0,yaw,0));

  const spd=Math.sqrt(player.velocity.x**2+player.velocity.z**2);
  if(spd>0.01)gunState.timeStoppedMoving=0;
  else if(gunState.timeStoppedMoving===0)gunState.timeStoppedMoving=Date.now();

  const sm=MOVEMENT_SPEED*(gameState.currentWeapon==='knife'?KNIFE_SPEED_MULT:1)*(player.isADS?.7:1);
  if(player.onGround){
    player.velocity.x+=moveDir.x*sm;player.velocity.z+=moveDir.z*sm;
    if(moveState.jump){player.velocity.y=JUMP_FORCE;player.onGround=false;}
  } else{player.velocity.x+=moveDir.x*(sm*.1);player.velocity.z+=moveDir.z*(sm*.1);}
  player.velocity.y-=GRAVITY;player.velocity.x*=FRICTION;player.velocity.z*=FRICTION;

  function wallCheck(){
    const b=new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(camera.position.x,camera.position.y-.7,camera.position.z),new THREE.Vector3(.6,1.4,.6));
    for(const c of colliders)if(c.intersectsBox(b))return true;return false;
  }
  camera.position.y+=player.velocity.y;
  if(camera.position.y<1.6){camera.position.y=1.6;player.velocity.y=0;player.onGround=true;}
  camera.position.x+=player.velocity.x;if(wallCheck()){camera.position.x-=player.velocity.x;player.velocity.x=0;}
  camera.position.z+=player.velocity.z;if(wallCheck()){camera.position.z-=player.velocity.z;player.velocity.z=0;}

  // Gun bob
  const bob=player.onGround?Math.sin(Date.now()*.008)*spd*.015:0;
  gunGroup.position.y=THREE.MathUtils.lerp(gunGroup.position.y,-.2+bob,.15);
  gunGroup.position.z=THREE.MathUtils.lerp(gunGroup.position.z,-.4,.1);
  const adsX=player.isADS&&gameState.currentWeapon!=='knife'?0:.2;
  gunGroup.position.x=THREE.MathUtils.lerp(gunGroup.position.x,adsX,.2);
  // Gun visibility: hide while scoped sniper, show otherwise
  const isScoped=player.isADS&&WEAPONS[gameState.currentWeapon].isSniper;
  gunGroup.visible=!isScoped;

  camera.fov=THREE.MathUtils.lerp(camera.fov,player.isADS?WEAPONS[gameState.currentWeapon].adsZoom:75,.15);
  camera.updateProjectionMatrix();

  // Sniper scope render into the scope canvas
  if(isScoped){
    scopeCamera.position.copy(camera.position);
    scopeCamera.rotation.copy(camera.rotation);
    scopeCamera.fov=6;scopeCamera.aspect=1;scopeCamera.updateProjectionMatrix();
    gunGroup.visible=false; // ensure hidden during scope render
    scopeRenderer.render(scene,scopeCamera);
  }

  const ab=gameState.abilities;
  if(ab.smoke.cooldown>0){ab.smoke.cooldown--;if(!ab.smoke.cooldown)updateHUD();}
  if(ab.dash.cooldown>0){ab.dash.cooldown--;if(!ab.dash.cooldown)updateHUD();}

  tickSpikeTimer();
  checkInteract();
  updateInteractPrompt();
  processShooting();
  updateCrosshairUI();
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ── INIT ──
applyGunVisuals('vandal');updateHUD();updateAbilityHud();updateWeaponSlotKeys();buildStartControls();
animate();
</script>
